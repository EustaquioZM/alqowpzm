<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Login UCSS - Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
    }

    body { 
      background-color: #f7f9fa; 
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(15, 32, 67, 0.05) 0%, transparent 60%);
      padding: 20px; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh;
    }

    .card { 
      background: #ffffff; 
      padding: 35px 30px; 
      border-radius: 16px; 
      box-shadow: 0 10px 40px rgba(15, 32, 67, 0.08), 0 0 0 1px rgba(212, 175, 55, 0.3); 
      width: 100%; 
      max-width: 440px; 
      position: relative;
    }

    .login-header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 1px solid #f0e6d2;
      padding-bottom: 18px;
    }

    .login-logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 12px;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.1));
    }

    h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      font-weight: 600;
      color: #0f2043;
      letter-spacing: 0.5px;
    }

    .form-group { 
      margin-bottom: 18px; 
    }

    label { 
      display: block; 
      margin-bottom: 6px; 
      font-weight: 600; 
      font-size: 13px;
      color: #2d3748;
    }

    input[type="text"], input[type="password"] { 
      width: 100%; 
      padding: 12px; 
      box-sizing: border-box; 
      border: 1px solid #e2e8f0; 
      border-radius: 8px; 
      font-size: 14px;
      background: #fcfcfc;
      transition: all 0.2s ease;
      outline: none;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #d4af37;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }

    button { 
      width: 100%; 
      padding: 12px; 
      background: linear-gradient(135deg, #0f2043 0%, #1a365d 100%); 
      color: #ffffff; 
      border: 1px solid #d4af37; 
      border-radius: 8px; 
      font-weight: 600; 
      font-size: 14px;
      letter-spacing: 0.3px;
      cursor: pointer; 
      transition: all 0.2s ease;
      margin-top: 5px;
    }

    button:hover { 
      background: linear-gradient(135deg, #1a365d 0%, #2a4365 100%); 
      box-shadow: 0 4px 12px rgba(15, 32, 67, 0.15);
    }

    .guest-link {
      margin-top: 22px; 
      text-align: center;
    }

    .guest-link a {
      color: #8c6d1f; 
      text-decoration: none; 
      font-size: 13px; 
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .guest-link a:hover {
      color: #0f2043;
      text-decoration: underline;
    }

    #resultado { 
      margin-top: 18px; 
      padding: 12px; 
      border-radius: 8px; 
      font-size: 13px;
      display: none; 
      line-height: 1.4;
    }

    .exito { 
      background: #f0fdf4; 
      color: #166534; 
      border: 1px solid #bbf7d0; 
    }

    .error { 
      background: #fef2f2; 
      color: #991b1b; 
      border: 1px solid #fecaca; 
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Login Chat Bot UCSS</h2>
      <div class="login-header">
      <img src="/img/logo.png" alt="Logo UCSS" class="login-logo">
      <h2>Login Chat Bot UCSS</h2>
    </div>


    <form id="loginForm">
      <div class="form-group">
        <label for="usuario">Código:</label>
        <input type="text" id="usuario" value="" placeholder="Tu codigo de estudiante" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" placeholder="Tu contraseña real" required>
      </div>
      <button type="submit" id="btnProcesar">Probar Login</button>
    </form>

    <div class="guest-link">
      <a href="/chat">Continuar como invitado (Consultas generales sin login) &rarr;</a>
    </div>

    <div id="resultado"></div>
  </div>

  <script src="/js/login.js"></script>

</body>
</html>
