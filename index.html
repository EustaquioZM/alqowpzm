<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Login UCSS - Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background: #003d80; }
    #resultado { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
    .exito { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Prueba de Autenticación UCSS</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="usuario">Código:</label>
        <input type="text" id="usuario" value="" placeholder="Tu codigo de estudiante" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" placeholder="Tu contraseña real" required>
      </div>
      <button type="submit" id="btnProcesar">Probar Login</button>
    </form>

    <div style="margin-top: 18px; text-align: center;">
      <a href="/chat" style="color: #0056b3; text-decoration: none; font-size: 14px; font-weight: bold;">Continuar como invitado (Consultas generales sin login) &rarr;</a>
    </div>

    <div id="resultado"></div>
  </div>

  <script src="/js/login.js"></script>

</body>
</html>
